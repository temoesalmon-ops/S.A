<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL iso SA</title>
<style>
  /* Charte « Dusty Blue & Navy » : navy #0B3B5D, bleu poudré #71869A, beige #DFD9D7 */
  :root {
    --bg: #dfd9d7;
    --surface: #ffffff;
    --soft: #f4f1f0;
    --text: #13293d;
    --muted: #71869a;
    --line: #e6e1df;
    --navy: #0b3b5d;
    --title: #0b3b5d;
    --accent: #0b3b5d;
    --accent-text: #ffffff;
    --dusty: #71869a;
    --ok-bg: #e3f1e8;
    --ok-text: #14532d;
    --err-bg: #f7e4e1;
    --err-text: #7f1d1d;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(11,59,93,.06), 0 4px 14px rgba(11,59,93,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1b26;
      --surface: #152837;
      --soft: #1b3244;
      --text: #e6ecf1;
      --muted: #9fb0c0;
      --line: #24394b;
      --title: #cfdde9;
      --accent: #0b3b5d;
      --accent-text: #ffffff;
      --dusty: #8fa3b6;
      --ok-bg: #15301f;
      --ok-text: #b8ebc8;
      --err-bg: #3a2224;
      --err-text: #f6c4c4;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .topbar { background: var(--navy); color: #fff; box-shadow: 0 2px 8px rgba(11,59,93,.25); }
  .topbar div { max-width: 720px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: baseline; gap: 12px; font-size: 1.1rem; }
  .topbar b { font-weight: 700; letter-spacing: -.01em; }
  .topbar small { font-size: .78rem; opacity: .75; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 2rem; font-weight: 800; color: var(--title); margin: 0 0 16px; letter-spacing: -0.02em; }
  h2 { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  #result { margin-top: 16px; }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    font: 0.95rem/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    background: var(--soft);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    resize: vertical;
  }
  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--dusty);
    outline-offset: 2px;
  }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.secondary {
    background: var(--surface);
    color: var(--title);
    border-color: var(--line);
  }
  button.secondary:hover { filter: none; background: var(--soft); border-color: var(--dusty); }
  .msg { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius); font-weight: 500; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-text); }
  .msg.err { background: var(--err-bg); color: var(--err-text); }
  .code-wrap {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  pre {
    flex: 1;
    margin: 0;
    padding: 12px 14px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--title);
    font: 700 1rem/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    overflow-x: auto;
    user-select: all;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar"><div><b>HL iso SA</b><small>Conversion vers Amadeus</small></div></header>
<main>
  <div class="card">

  <label for="pnr" class="sr" style="position:absolute;left:-9999px">Texte du PNR</label>
  <textarea id="pnr" spellcheck="false" autocomplete="off"></textarea>

  <div class="actions">
    <button type="button" id="go">LOUIA LE QUARTIER</button>
  </div>
  </div>

  <div id="msg" class="msg" hidden role="status"></div>

  <section id="result" class="card" hidden>
    <h2>Résultat à copier-coller :</h2>
    <div class="code-wrap">
      <pre id="code"></pre>
      <button type="button" id="copy" class="secondary">Copier</button>
    </div>
  </section>
</main>

<script>
  const pnr = document.getElementById("pnr");
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  const code = document.getElementById("code");
  const copyBtn = document.getElementById("copy");

  const PATTERN = /([A-Z0-9]{2})\s+(\d+)\s+([A-Z])\s+(\d{2}[A-Z]{3})\s+(\d+)\s+([A-Z]{6})\s+([A-Z]{2})(\d+)/;

  function show(type, text) {
    msg.className = "msg " + type;
    msg.textContent = text;
    msg.hidden = false;
  }

  document.getElementById("go").addEventListener("click", () => {
    msg.hidden = true;
    result.hidden = true;
    try {
      const m = PNR_MATCH(pnr.value);
      if (!m) {
        show("err", "Impossible de reconnaitre le format de la ligne. Vérifiez votre texte.");
        return;
      }
      const airline = m[1];
      const flightNum = m[2];
      const cls = m[3];
      const date = m[4];
      const route = m[6];
      const paxCount = m[8];

      const amadeus = "SS" + airline + flightNum + cls.toLowerCase() +
                      date.toLowerCase() + route.toLowerCase() + "LF" + paxCount;

      code.textContent = amadeus;
      result.hidden = false;
      show("ok", "Code généré avec succès !");
    } catch (e) {
      show("err", "Une erreur est survenue lors du traitement : " + e.message);
    }
  });

  function PNR_MATCH(text) { return PATTERN.exec(text); }

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code.textContent);
      copyBtn.textContent = "Copié";
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(code);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
      copyBtn.textContent = "Sélectionné";
    }
    setTimeout(() => { copyBtn.textContent = "Copier"; }, 1500);
  });
</script>
</body>
</html>
